<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramo 5 · CTM — Reunião Sacramental</title>
<style>
  :root {
    --rs-navy: #1F3A5F; --rs-gold: #B8923F; --rs-gold-light: #F3E9D2;
    --rs-cream: #FBFAF7; --rs-line: #E2DED4; --rs-ink: #2A2A28; --rs-ink-soft: #6B685F;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--rs-ink); background:#fff; margin:0; padding:20px 14px 60px; }
  .rs-app { max-width: 720px; margin: 0 auto; }
  .rs-header { text-align: center; padding: 0 0 20px; border-bottom: 2px solid var(--rs-gold); margin-bottom: 24px; }
  .rs-header h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 24px; color: var(--rs-navy); margin: 0 0 4px; }
  .rs-header p { font-size: 13px; color: var(--rs-ink-soft); margin: 0; text-transform: uppercase; letter-spacing: 1.5px; }
  .rs-status { margin-top:10px; font-size:11.5px; padding:6px 10px; border-radius:5px; display:inline-block; }
  .rs-status.connecting { color:#8A6D2F; background:#FBF3E0; border:1px solid #E9D9AE; }
  .rs-status.online { color:#33633A; background:#E9F2E8; border:1px solid #C9E0C6; }
  .rs-status.offline { color:#A33333; background:#FBEAEA; border:1px solid #E3B8B8; }
  .rs-tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 1px solid var(--rs-line); }
  .rs-tab { flex: 1; padding: 10px 8px; text-align: center; font-size: 14px; cursor: pointer; color: var(--rs-ink-soft); border-bottom: 2px solid transparent; user-select: none; }
  .rs-tab.active { color: var(--rs-navy); border-bottom-color: var(--rs-navy); font-weight: 600; }
  .rs-section-title { font-family: Georgia, serif; font-size: 15px; color: var(--rs-navy); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rs-line); }
  .rs-section-title:first-child { margin-top: 0; }
  .rs-field { margin-bottom: 14px; }
  .rs-field label { display: block; font-size: 12.5px; color: var(--rs-ink-soft); margin-bottom: 4px; }
  .rs-field input[type=text], .rs-field input[type=date], .rs-field textarea {
    width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--rs-line);
    border-radius: 5px; background: #fff; color: var(--rs-ink); font-family: inherit;
  }
  .rs-field input:focus, .rs-field textarea:focus { outline: none; border-color: var(--rs-navy); }
  .rs-field textarea { resize: vertical; min-height: 44px; }
  .rs-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rs-discurso-row { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .rs-discurso-num { font-size: 13px; color: var(--rs-gold); font-weight: 600; text-align: center; }
  .rs-discurso-row input { width:100%; padding:9px 10px; font-size:14px; border:1px solid var(--rs-line); border-radius:5px; background:#fff; color:var(--rs-ink); font-family: inherit; }
  .rs-btnbar { display: flex; gap: 10px; margin-top: 26px; }
  .rs-btn { flex: 1; padding: 11px; font-size: 14px; border-radius: 6px; cursor: pointer; border: 1px solid var(--rs-navy); background: #fff; color: var(--rs-navy); text-align: center; }
  .rs-btn.primary { background: var(--rs-navy); color: #fff; }
  .rs-btn:hover { opacity: 0.88; }
  .rs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .rs-msg { font-size: 13px; padding: 8px 10px; border-radius: 5px; margin-top: 10px; display: none; }
  .rs-msg.ok { background: #E9F2E8; color: #33633A; display: block; }
  .rs-msg.err { background: #FBEAEA; color: #A33333; display: block; }
  .rs-hist-empty { text-align: center; color: var(--rs-ink-soft); font-size: 14px; padding: 40px 10px; }
  .rs-hist-card { border: 1px solid var(--rs-line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  .rs-hist-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; background: var(--rs-cream); }
  .rs-hist-date { font-family: Georgia, serif; font-size: 15px; color: var(--rs-navy); }
  .rs-hist-sub { font-size: 12px; color: var(--rs-ink-soft); margin-top: 2px; }
  .rs-hist-chevron { color: var(--rs-gold); font-size: 12px; transition: transform 0.15s; }
  .rs-hist-body { padding: 4px 14px 14px; display: none; font-size: 13.5px; line-height: 1.7; border-top: 1px solid var(--rs-line); }
  .rs-hist-body.open { display: block; }
  .rs-hist-row { display: flex; padding: 4px 0; border-bottom: 1px dashed #EDEAE0; }
  .rs-hist-row:last-child { border-bottom: none; }
  .rs-hist-label { width: 46%; color: var(--rs-ink-soft); flex-shrink: 0; }
  .rs-hist-val { flex: 1; }
  .rs-hist-actions { display: flex; gap: 8px; margin-top: 12px; }
  .rs-hist-actions button { font-size: 12.5px; padding: 6px 12px; border-radius: 5px; border: 1px solid var(--rs-line); background: #fff; cursor: pointer; color: var(--rs-ink-soft); }
  .rs-hist-actions button.danger { border-color: #E3B8B8; color: #A33333; }
  .rs-loading { text-align: center; color: var(--rs-ink-soft); font-size: 13px; padding: 20px; }
</style>
</head>
<body>

<div class="rs-app">
  <div class="rs-header">
    <h1>Ramo 5 &middot; CTM</h1>
    <p>Reunião Sacramental</p>
    <div class="rs-status connecting" id="conn-status">Conectando ao banco de dados…</div>
  </div>

  <div class="rs-tabs">
    <div class="rs-tab active" data-tab="form">Preencher</div>
    <div class="rs-tab" data-tab="history">Histórico</div>
  </div>

  <div id="rs-view-form">
    <div class="rs-field">
      <label>Data da Reunião</label>
      <input type="date" id="f-date" />
    </div>

    <div class="rs-section-title">Abertura</div>
    <div class="rs-field"><label>Prelúdio musical</label><input type="text" id="f-preludio" placeholder="Quem toca" /></div>
    <div class="rs-row2">
      <div class="rs-field"><label>Dirigido Por:</label><input type="text" id="f-dirigido" placeholder="Nome" /></div>
      <div class="rs-field"><label>Presidido Por:</label><input type="text" id="f-presidido" placeholder="Nome" /></div>
    </div>
    <div class="rs-field"><label>Regente:</label><input type="text" id="f-regente" placeholder="Nome" /></div>
    <div class="rs-field"><label>Reconhecimentos:</label><input type="text" id="f-reconhecimentos" placeholder="Autoridades ou visitantes, se houver" /></div>
    <div class="rs-field"><label>Anúncios:</label><textarea id="f-anuncios" placeholder="Resumo dos anúncios"></textarea></div>
    <div class="rs-field"><label>Hino de Abertura:</label><input type="text" id="f-hino-abertura" placeholder="Nº e nome do hino" /></div>
    <div class="rs-field"><label>Oração de Abertura:</label><input type="text" id="f-oracao-abertura" placeholder="Nome" /></div>
    <div class="rs-field"><label>Hino sacramental:</label><input type="text" id="f-hino-sacramental" placeholder="Nº e nome do hino" /></div>

    <div class="rs-section-title">Discursos e Número Musical</div>
    <div id="f-discursos-1a4"></div>
    <div class="rs-field"><label>Número musical especial</label><input type="text" id="f-numero-musical" placeholder="Quem e o quê" /></div>
    <div id="f-discurso-5"></div>

    <div class="rs-section-title">Encerramento</div>
    <div class="rs-field"><label>Hino de Encerramento:</label><input type="text" id="f-hino-encerramento" placeholder="Nº e nome do hino" /></div>
    <div class="rs-field"><label>Oração de Encerramento:</label><input type="text" id="f-oracao-encerramento" placeholder="Nome" /></div>

    <div class="rs-btnbar">
      <button class="rs-btn" id="btn-clear">Limpar formulário</button>
      <button class="rs-btn primary" id="btn-save">Salvar reunião</button>
    </div>
    <div class="rs-msg" id="f-msg"></div>
  </div>

  <div id="rs-view-history" style="display:none;">
    <div id="hist-list"><div class="rs-loading">Carregando histórico…</div></div>
  </div>
</div>

<!-- Firebase SDK (compat, via CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
// ======================================================================
// COLE SEU firebaseConfig AQUI — substitua o objeto abaixo pelo que o
// Firebase te deu no passo "Registrar um app Web".
// ======================================================================
const firebaseConfig = {
  apiKey: "SUA_API_KEY_AQUI",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "SEU_SENDER_ID",
  appId: "SEU_APP_ID"
};
// ======================================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COLLECTION = "reunioes_ramo5";

const statusEl = document.getElementById('conn-status');
db.collection(COLLECTION).limit(1).get()
  .then(() => { statusEl.textContent = 'Conectado — dados salvos em tempo real'; statusEl.className = 'rs-status online'; })
  .catch((err) => { statusEl.textContent = 'Erro de conexão: ' + err.message; statusEl.className = 'rs-status offline'; });

(function() {
  const discursoLabels1a4 = ["Primeiro Orador(a) (Elder/Sister)", "Segundo Orador(a) (Elder/Sister)", "Terceiro Orador(a) (Elder/Sister)", "Quarto Orador(a) (Elder/Sister)"];
  const wrap1a4 = document.getElementById('f-discursos-1a4');
  discursoLabels1a4.forEach((label, i) => {
    const row = document.createElement('div');
    row.className = 'rs-discurso-row';
    row.innerHTML = '<div class="rs-discurso-num">' + (i+1) + '</div>' +
      '<input type="text" class="f-discurso" data-idx="' + i + '" placeholder="' + label + '" />';
    wrap1a4.appendChild(row);
  });
  const wrap5 = document.getElementById('f-discurso-5');
  wrap5.innerHTML = '<div class="rs-discurso-row"><div class="rs-discurso-num">5</div>' +
    '<input type="text" class="f-discurso" data-idx="4" placeholder="Quinto Orador(a)" /></div>';

  const tabs = document.querySelectorAll('.rs-tab');
  const viewForm = document.getElementById('rs-view-form');
  const viewHistory = document.getElementById('rs-view-history');
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    if (t.dataset.tab === 'form') {
      viewForm.style.display = ''; viewHistory.style.display = 'none';
    } else {
      viewForm.style.display = 'none'; viewHistory.style.display = ''; loadHistory();
    }
  }));

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  document.getElementById('f-date').value = todayISO();

  function collectForm() {
    return {
      date: document.getElementById('f-date').value,
      preludio: document.getElementById('f-preludio').value.trim(),
      dirigidoPor: document.getElementById('f-dirigido').value.trim(),
      presididoPor: document.getElementById('f-presidido').value.trim(),
      regente: document.getElementById('f-regente').value.trim(),
      reconhecimentos: document.getElementById('f-reconhecimentos').value.trim(),
      anuncios: document.getElementById('f-anuncios').value.trim(),
      hinoAbertura: document.getElementById('f-hino-abertura').value.trim(),
      oracaoAbertura: document.getElementById('f-oracao-abertura').value.trim(),
      hinoSacramental: document.getElementById('f-hino-sacramental').value.trim(),
      discursos: Array.from(document.querySelectorAll('.f-discurso')).map(el => el.value.trim()),
      numeroMusical: document.getElementById('f-numero-musical').value.trim(),
      hinoEncerramento: document.getElementById('f-hino-encerramento').value.trim(),
      oracaoEncerramento: document.getElementById('f-oracao-encerramento').value.trim(),
    };
  }

  function fillForm(entry) {
    document.getElementById('f-date').value = entry.date || todayISO();
    document.getElementById('f-preludio').value = entry.preludio || '';
    document.getElementById('f-dirigido').value = entry.dirigidoPor || '';
    document.getElementById('f-presidido').value = entry.presididoPor || '';
    document.getElementById('f-regente').value = entry.regente || '';
    document.getElementById('f-reconhecimentos').value = entry.reconhecimentos || '';
    document.getElementById('f-anuncios').value = entry.anuncios || '';
    document.getElementById('f-hino-abertura').value = entry.hinoAbertura || '';
    document.getElementById('f-oracao-abertura').value = entry.oracaoAbertura || '';
    document.getElementById('f-hino-sacramental').value = entry.hinoSacramental || '';
    const discursoEls = document.querySelectorAll('.f-discurso');
    discursoEls.forEach((el, i) => { el.value = (entry.discursos && entry.discursos[i]) || ''; });
    document.getElementById('f-numero-musical').value = entry.numeroMusical || '';
    document.getElementById('f-hino-encerramento').value = entry.hinoEncerramento || '';
    document.getElementById('f-oracao-encerramento').value = entry.oracaoEncerramento || '';
  }

  function clearForm() { fillForm({ date: todayISO() }); }
  document.getElementById('btn-clear').addEventListener('click', clearForm);

  function showMsg(text, ok) {
    const el = document.getElementById('f-msg');
    el.textContent = text;
    el.className = 'rs-msg ' + (ok ? 'ok' : 'err');
    setTimeout(() => { el.className = 'rs-msg'; }, 3500);
  }

  function formatDate(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return d + '/' + m + '/' + y;
  }

  document.getElementById('btn-save').addEventListener('click', async () => {
    const entry = collectForm();
    if (!entry.date) { showMsg('Informe a data da reunião antes de salvar.', false); return; }
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    try {
      await db.collection(COLLECTION).doc(entry.date).set(entry);
      showMsg('Reunião de ' + formatDate(entry.date) + ' salva no histórico.', true);
    } catch (err) {
      showMsg('Erro ao salvar: ' + err.message, false);
    } finally {
      btn.disabled = false;
    }
  });

  async function loadHistory() {
    const listEl = document.getElementById('hist-list');
    listEl.innerHTML = '<div class="rs-loading">Carregando histórico…</div>';
    try {
      const snapshot = await db.collection(COLLECTION).orderBy('date', 'desc').get();
      if (snapshot.empty) {
        listEl.innerHTML = '<div class="rs-hist-empty">Nenhuma reunião salva ainda.<br/>Preencha o formulário e clique em "Salvar reunião".</div>';
        return;
      }
      const entries = [];
      snapshot.forEach(doc => entries.push(doc.data()));
      renderHistory(entries);
    } catch (err) {
      listEl.innerHTML = '<div class="rs-hist-empty">Erro ao carregar histórico: ' + err.message + '</div>';
    }
  }

  function fieldRow(label, value) {
    if (!value) return '';
    return '<div class="rs-hist-row"><div class="rs-hist-label">' + label + '</div><div class="rs-hist-val">' + escapeHtml(value) + '</div></div>';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderHistory(entries) {
    const listEl = document.getElementById('hist-list');
    listEl.innerHTML = '';
    entries.forEach(entry => {
      const card = document.createElement('div');
      card.className = 'rs-hist-card';
      const discursosCount = (entry.discursos || []).filter(Boolean).length;
      card.innerHTML =
        '<div class="rs-hist-head">' +
          '<div><div class="rs-hist-date">' + formatDate(entry.date) + '</div>' +
          '<div class="rs-hist-sub">' + (entry.dirigidoPor ? 'Dirigido por: ' + escapeHtml(entry.dirigidoPor) + ' · ' : '') + discursosCount + ' orador(es)</div></div>' +
          '<div class="rs-hist-chevron">&#9662;</div>' +
        '</div>' +
        '<div class="rs-hist-body">' +
          fieldRow('Prelúdio musical', entry.preludio) +
          fieldRow('Dirigido por', entry.dirigidoPor) +
          fieldRow('Presidido por', entry.presididoPor) +
          fieldRow('Regente', entry.regente) +
          fieldRow('Reconhecimentos', entry.reconhecimentos) +
          fieldRow('Anúncios', entry.anuncios) +
          fieldRow('Hino de abertura', entry.hinoAbertura) +
          fieldRow('Oração de abertura', entry.oracaoAbertura) +
          fieldRow('Hino sacramental', entry.hinoSacramental) +
          fieldRow('Primeiro orador(a)', entry.discursos && entry.discursos[0]) +
          fieldRow('Segundo orador(a)', entry.discursos && entry.discursos[1]) +
          fieldRow('Terceiro orador(a)', entry.discursos && entry.discursos[2]) +
          fieldRow('Quarto orador(a)', entry.discursos && entry.discursos[3]) +
          fieldRow('Número musical especial', entry.numeroMusical) +
          fieldRow('Quinto orador(a)', entry.discursos && entry.discursos[4]) +
          fieldRow('Hino de encerramento', entry.hinoEncerramento) +
          fieldRow('Oração de encerramento', entry.oracaoEncerramento) +
          '<div class="rs-hist-actions">' +
            '<button class="btn-edit">Editar</button>' +
            '<button class="btn-delete danger">Excluir</button>' +
          '</div>' +
        '</div>';

      const head = card.querySelector('.rs-hist-head');
      const body = card.querySelector('.rs-hist-body');
      const chevron = card.querySelector('.rs-hist-chevron');
      head.addEventListener('click', () => {
        const open = body.classList.toggle('open');
        chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
      });

      card.querySelector('.btn-edit').addEventListener('click', (e) => {
        e.stopPropagation();
        fillForm(entry);
        document.querySelector('.rs-tab[data-tab="form"]').click();
        showMsg('Reunião de ' + formatDate(entry.date) + ' carregada para edição.', true);
      });

      card.querySelector('.btn-delete').addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('Excluir a reunião de ' + formatDate(entry.date) + ' do histórico?')) return;
        try {
          await db.collection(COLLECTION).doc(entry.date).delete();
          loadHistory();
        } catch (err) {
          alert('Erro ao excluir: ' + err.message);
        }
      });

      listEl.appendChild(card);
    });
  }
})();
</script>
</body>
</html>
